<title>Hexagon Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="lab.css">

<div class="page">
  <header class="header">
    <a class="brand" href="#bench"><span class="brand-mark" id="brand-mark"></span>Hexagon Lab</a>
    <button type="button" class="btn btn-ghost btn-icon" id="theme" data-on="false" aria-label="Toggle dark mode">
      <span class="swap">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-17.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </span>
    </button>
  </header>

  <main class="bench" id="bench">
    <section class="card stage-card" aria-label="Mark">
      <div class="stage" id="stage">
        <div class="stage-layer" id="stage-svg"></div>
        <div class="stage-layer stage-fade" id="stage-fade"></div>
        <div class="stage-layer stage-guides" id="stage-guides"></div>
        <div class="stage-top">
          <button type="button" class="btn btn-outline btn-sm" id="tour-btn" data-on="false" aria-pressed="false">
            <span class="swap">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>
            </span>
            <span id="tour-label">Tour</span><span class="tour-step mono" id="tour-step"></span>
          </button>
          <label class="switch-row" for="guides"><button type="button" role="switch" aria-checked="false" class="switch" id="guides"><span class="switch-thumb"></span></button>Guides</label>
        </div>
      </div>
      <div class="stage-bar">
        <button type="button" class="btn btn-primary btn-sm" id="shuffle">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 14 4 4-4 4M18 2l4 4-4 4M2 18h1.97a4 4 0 0 0 3.3-1.7l5.46-8.6a4 4 0 0 1 3.3-1.7H22M2 6h1.97a4 4 0 0 1 3.6 2.2M22 18h-6.04a4 4 0 0 1-3.3-1.8l-.36-.45"/></svg>
          Shuffle
        </button>
        <button type="button" class="btn btn-outline btn-sm" id="copy" data-on="false">
          <span class="swap">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
          </span>
          Copy SVG
        </button>
        <button type="button" class="btn btn-ghost btn-sm btn-icon" id="reset" aria-label="Reset to master">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <span class="badge" id="preset-badge">Master</span>
      </div>
    </section>

    <aside class="card inspector" aria-label="Controls">
      <div class="section"><div class="section-label">Presets</div><div class="presets" id="presets"></div></div>
      <div class="sep"></div>
      <div class="section"><div class="section-label">Color</div><div class="swatches" id="swatches" role="radiogroup" aria-label="Color"></div></div>
      <div class="sep"></div>
      <div class="section" id="g-echo"><div class="section-label">Echo</div><div class="dials"></div></div>
      <div class="sep"></div>
      <div class="section" id="g-fade"><div class="section-label">Fade</div><div class="dials"></div></div>
      <div class="sep"></div>
      <div class="section" id="g-front"><div class="section-label">Front</div><div class="dials"></div></div>
    </aside>
  </main>

  <section class="tabs">
    <div class="tabs-head">
      <div class="tabs-list" role="tablist" aria-label="Views">
        <button type="button" role="tab" class="tab" id="tab-variations" aria-controls="panel-variations" aria-selected="true">Variations</button>
        <button type="button" role="tab" class="tab" id="tab-motion" aria-controls="panel-motion" aria-selected="false" tabindex="-1">Motion</button>
        <button type="button" role="tab" class="tab" id="tab-use" aria-controls="panel-use" aria-selected="false" tabindex="-1">In use</button>
      </div>
      <div class="tabs-head" id="field-tools">
        <span class="stat"><b id="count">3.0 × 10<sup>23</sup></b><span class="muted">combinations</span></span>
        <button type="button" class="btn btn-outline btn-sm" id="reshuffle">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
          Regenerate
        </button>
      </div>
    </div>

    <div class="panel" role="tabpanel" id="panel-variations" aria-labelledby="tab-variations">
      <div class="field" id="field-grid"></div>
    </div>
    <div class="panel" role="tabpanel" id="panel-motion" aria-labelledby="tab-motion" hidden>
      <div class="loops" id="loops"></div>
    </div>
    <div class="panel" role="tabpanel" id="panel-use" aria-labelledby="tab-use" hidden>
      <div class="uses">
        <div class="card use">
          <h3 class="card-title">App icon</h3>
          <div class="icons" id="icons"></div>
        </div>
        <div class="card use">
          <h3 class="card-title">Favicon</h3>
          <div class="browsers">
            <div class="browser light">
              <div class="tabbar">
                <div class="btab on"><span class="fav"></span><span class="btab-title wordmark">hexalabs</span></div>
                <div class="btab"><span class="fav fav-blank"></span><span class="btab-title">New tab</span></div>
              </div>
              <div class="urlbar"></div>
            </div>
            <div class="browser dark">
              <div class="tabbar">
                <div class="btab on"><span class="fav"></span><span class="btab-title wordmark">hexalabs</span></div>
                <div class="btab"><span class="fav fav-blank"></span><span class="btab-title">New tab</span></div>
              </div>
              <div class="urlbar"></div>
            </div>
          </div>
        </div>
        <div class="card use">
          <h3 class="card-title">Lockup</h3>
          <div class="lockups">
            <div class="lockup dark"><span class="lk-mark" id="lk-dark"></span><span class="lk-word wordmark">hexalabs</span></div>
            <div class="lockup light"><span class="lk-mark" id="lk-light"></span><span class="lk-word wordmark">hexalabs</span></div>
          </div>
          <div class="name-row"><label class="label" for="wordmark">Name</label><input class="input" id="wordmark" type="text" value="hexalabs" autocomplete="off" spellcheck="false"></div>
        </div>
        <div class="card use">
          <h3 class="card-title">Avatar</h3>
          <div class="avatars">
            <span id="avatar-big"></span>
            <div class="profile">
              <span id="avatar-small"></span>
              <span class="profile-meta"><b class="wordmark">hexalabs</b><span class="muted mono" id="avatar-handle">@hexalabs</span></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span id="toast-text"></span>
</div>

<dialog id="code-dialog" aria-labelledby="code-title">
  <div class="dlg">
    <h3 class="card-title" id="code-title">SVG code</h3>
    <textarea id="code-text" readonly aria-label="SVG code"></textarea>
    <button type="button" class="btn btn-outline btn-sm" id="code-close">Close</button>
  </div>
</dialog>

<script src="hex.js"></script>
<script src="bench.js"></script>
<script src="extras.js"></script>
